services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: axel-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./chroma_db:/app/chroma_db

    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: axel-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: unless-stopped